name: Release

# HACS haalt bij een Lovelace-kaart normaal één los bestand op. Dit pakket is
# bewust zonder buildstap en bestaat dus uit meerdere modules, en `src/` zou bij
# zo'n download niet meekomen. Daarom `zip_release` in hacs.json, en daarom deze
# workflow: hij plakt bij elke tag een zip aan de release waar het entry-bestand
# én src/ in zitten.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag om een release voor te maken, bijvoorbeeld v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie bepalen
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Controleren of de tag klopt met VERSION
        run: |
          IN_FILE=$(grep -oP 'export const VERSION = "\K[^"]+' domotiapp-cards.js)
          if [ "$IN_FILE" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::Tag zegt ${{ steps.v.outputs.version }}, domotiapp-cards.js zegt $IN_FILE."
            echo "Draai eerst: node dev/bump.mjs ${{ steps.v.outputs.version }}"
            exit 1
          fi

      - name: Controleren of elke import gestempeld is
        # Een import zonder ?v= overleeft een update in de browsercache van de
        # klant, en koppelt dan nieuwe code aan oude modules.
        run: |
          if grep -rEn '(from|import) +"\.[^"]*\.js"' --include='*.js' . ; then
            echo "::error::Bovenstaande imports missen ?v=. Draai node dev/bump.mjs"
            exit 1
          fi

      - name: Syntaxcheck
        run: |
          find . -name '*.js' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Zip bouwen
        run: |
          zip -r domotiapp-cards.zip \
            domotiapp-cards.js src hacs.json README.md LICENSE

      - name: Release publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: domotiapp-cards.zip
