name: Release

# HACS registreert voor een dashboardkaart precies één resource-URL, en dat is
# `filename` uit hacs.json. Daarom hangt aan elke release het gebouwde
# dist/domotiapp-cards.js -- één bestand, precies wat HACS verwacht.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag om een release voor te maken, bijvoorbeeld v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Versie bepalen
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Controleren of de tag klopt met VERSION
        run: |
          IN_FILE=$(grep -oP 'export const VERSION = "\K[^"]+' src/index.js)
          if [ "$IN_FILE" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::Tag zegt ${{ steps.v.outputs.version }}, src/index.js zegt $IN_FILE."
            echo "Draai eerst: node dev/bump.mjs ${{ steps.v.outputs.version }}"
            exit 1
          fi

      - name: Syntaxcheck op de bronnen
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Bouwen
        run: |
          npm ci || npm install
          node dev/build.mjs

      - name: Controleren of dist/ meegecommit is en klopt
        # Een dist die achterloopt op src is erger dan geen dist: een handmatige
        # installatie pakt hem wel, en draait dan stilletjes oude code.
        run: |
          if ! git diff --quiet -- dist/domotiapp-cards.js; then
            echo "::error::dist/domotiapp-cards.js loopt achter op src/. Draai node dev/build.mjs en commit het resultaat."
            git diff --stat -- dist/domotiapp-cards.js
            exit 1
          fi

      - name: Release publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: dist/domotiapp-cards.js
